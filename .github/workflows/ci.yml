name: CI

# Validación sin credenciales ni servicios productivos. La publicación vive en deploy-firebase.yml.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:content
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests without external connections
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/e2e/support/offline-build.cjs
        run: npm test

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # La precarga responde la hoja de fuentes con una copia versionada y rechaza el resto.
      - name: Production build without external connections
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/e2e/support/offline-build.cjs
          PORTFOLIO_NETWORK_LOG: ${{ runner.temp }}/blocked-connections.log
        shell: bash
        run: |
          npm run build
          if [[ -s "$PORTFOLIO_NETWORK_LOG" ]]; then
            echo "El build intentó conectarse fuera del runner:"
            sort "$PORTFOLIO_NETWORK_LOG" | uniq -c
            exit 1
          fi
      - run: npm run build:release-manifest
      - run: npm run build:chat-knowledge-payload
      - name: Upload site for browser tests
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-${{ github.sha }}
          path: |
            dist/portfolio/browser
            public/diagrams
            src/assets/blog
            src/assets/projects.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload release manifest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-manifest
          path: .generated/release-manifest.json
          include-hidden-files: true
      - name: Upload chat knowledge artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chat-knowledge
          path: |
            .generated/chat/knowledge.json
            .generated/chat/knowledge-payload.json
          include-hidden-files: true

  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PORTFOLIO_E2E_BUILD: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/firebase-cli/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/firebase-cli --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8.0.2
        with:
          name: site-${{ github.sha }}
          path: .
      - name: Prerendered content and Hosting contract without JavaScript
        run: npm run test:e2e -- --project=html
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e -- --project=chromium
      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-traces
          path: .generated/playwright-results
          include-hidden-files: true
          if-no-files-found: ignore

  verify:
    name: verify
    if: always()
    needs: [quality, build, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RESULTS: ${{ needs.quality.result }} ${{ needs.build.result }} ${{ needs.browser.result }}
    steps:
      - name: Report required check
        shell: bash
        run: |
          echo "quality, build, browser: $RESULTS"
          [[ "$RESULTS" == "success success success" ]]
