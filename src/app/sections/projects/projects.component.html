<section id="projects" tabindex="-1" class="projects-shell" aria-labelledby="projects-title">
  <div class="page-container projects-body">
    <header class="projects-intro">
      <h2 id="projects-title" class="section-title">Proyectos</h2>
      <p>Una selección de proyectos donde combiné producto, backend, arquitectura y cloud.</p>
    </header>

    @if (errorMessage() && !projects().length) {
      <p class="feedback feedback--danger" role="alert">
        No se pudieron cargar los proyectos. Recargá la página para volver a intentar.
      </p>
    } @else {
      <div class="projects-grid">
        @for (project of sortedProjects(); track project.slug) {
          <app-project-card [project]="project" />
        }
      </div>
    }
  </div>
</section>
