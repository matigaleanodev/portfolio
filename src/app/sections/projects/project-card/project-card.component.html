<article class="project-card">
  <div class="project-card__top">
    <img
      [src]="project().coverImage"
      [alt]="'Ilustración del producto: ' + project().title"
      width="64"
      height="64"
      loading="lazy"
      decoding="async"
      class="project-card__image"
    />

    <header class="project-card__header">
      <p class="project-card__type">{{ project().productType }}</p>
      <h3 class="project-card__title">{{ project().title }}</h3>
    </header>
  </div>

  <p class="project-card__excerpt">{{ project().excerpt }}</p>

  @if (project().stack.length) {
    <ul class="project-card__stack" aria-label="Tecnologías principales">
      @for (tech of project().stack.slice(0, 3); track tech) {
        <li class="project-tech-chip">{{ tech }}</li>
      }
    </ul>
  }

  <a
    [routerLink]="['/projects', project().slug]"
    [attr.aria-label]="'Ver proyecto ' + project().title"
    class="link-primary project-card__action"
  >
    Ver proyecto
  </a>
</article>
