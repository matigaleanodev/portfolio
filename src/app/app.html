<a class="skip-link" appFragmentLink="main-content" [attr.inert]="chatModal() ? '' : null"
  >Saltar al contenido principal</a
>

<div class="app-shell" [attr.inert]="chatModal() ? '' : null">
  <app-header />

  <div
    id="main-content"
    class="app-view"
    tabindex="-1"
    [class.app-view--transition]="routeTransitionActive()"
  >
    <router-outlet />
  </div>

  <app-footer />
</div>
<app-chat (modalChange)="chatModal.set($event)" />

<app-toast />
