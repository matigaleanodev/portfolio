<div class="toast-region">
  <div
    class="toast-slot"
    [class.toast]="toast.state().visible"
    [class.toast--showing]="toast.state().showing"
    (mouseenter)="hold('hover', true)"
    (mouseleave)="hold('hover', false)"
    (focusin)="focusEntered($event)"
    (focusout)="hold('focus', false)"
  >
    @if (toast.state().visible) {
      <lucide-icon [img]="checkIcon" size="16" aria-hidden="true" />
    }
    <p class="toast__text" role="status">
      {{ toast.state().visible ? toast.state().message : '' }}
    </p>
    @if (toast.state().visible) {
      <button type="button" class="btn btn--icon" aria-label="Cerrar aviso" (click)="close()">
        <lucide-icon [img]="closeIcon" size="20" aria-hidden="true" />
      </button>
    }
  </div>
</div>
