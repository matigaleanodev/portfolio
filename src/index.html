    <script>
      (() => {
        // Quita `email` de la consulta, del fragmento y de la ruta; devuelve el valor retirado.
        const takeEmail = (url) => {
          let email;
          // En el fragmento exige un valor: `#email` puede ser un ancla.
          const strip = (params, requireValue) => {
            let found = false;
            for (const [key, value] of [...params]) {
              if (key.toLowerCase() !== 'email' || (requireValue && !value)) continue;
              email ??= value;
              params.delete(key);
              found = true;
            }
            return found;
          };
          strip(url.searchParams, false);
          const fragment = new URLSearchParams(url.hash.slice(1));
          if (strip(fragment, true)) url.hash = fragment.toString();
          url.pathname = url.pathname.replace(/;email=([^/;]*)/gi, (_, value) => {
            try {
              email ??= decodeURIComponent(value);
            } catch {
              // Mal codificada: se retira igual, sin precompletar.
              email ??= '';
            }
            return '';
          });
          return email;
        };

        const url = new URL(location.href);
        const email = takeEmail(url);
        if (email !== undefined) {
          if (/^\/+blog\/unsubscribe(?:\.html|\/(?:index(?:\.html)?)?)?$/.test(url.pathname)) {
            // Hand the prefill to Angular once, without putting it in storage or history state.
            document.portfolioUnsubscribeEmail = email;
          }
          try {
            history.replaceState(history.state, '', url.href);
          } catch {
            // A restricted history still permits the prefill and must keep analytics disabled.
          }
          return;
        }
        if (document.referrer && takeEmail(new URL(document.referrer)) !== undefined) {
          return;
        }

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag('js', new Date());
        window.gtag('config', 'G-GBQ307ZC8X');

        const tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-GBQ307ZC8X';
        document.head.appendChild(tag);
      })();
    </script>
