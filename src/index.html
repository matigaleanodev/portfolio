    <script>
      (() => {
        const isLegacyUnsubscribe = (url) =>
          /^\/blog\/unsubscribe(?:\.html|\/(?:index(?:\.html)?)?)?$/.test(url.pathname) &&
          url.searchParams.has('email');

        const url = new URL(location.href);
        if (isLegacyUnsubscribe(url)) {
          // Hand the prefill to Angular once, without putting it in storage or history state.
          document.portfolioUnsubscribeEmail = url.searchParams.get('email');
          url.searchParams.delete('email');
          try {
            history.replaceState(history.state, '', url.href);
          } catch {
            // A restricted history still permits the prefill and must keep analytics disabled.
          }
          return;
        }
        if (document.referrer && isLegacyUnsubscribe(new URL(document.referrer))) {
          return;
        }

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag('js', new Date());
        window.gtag('config', 'G-GBQ307ZC8X');

        const tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-GBQ307ZC8X';
        document.head.appendChild(tag);
      })();
    </script>
